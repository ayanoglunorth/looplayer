<html><body style="margin:0;background:#222;display:flex;flex-wrap:wrap;gap:24px;padding:24px;font:14px sans-serif;color:#ddd">
<div><div style="width:260px;height:260px;border-radius:56px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="260" height="260">
  <rect width="260" height="260" fill="#000000" />
  <!-- Upper track: white arc flowing into top subtitle bar -->
  <path d="M 38 66 A 12 12 0 0 1 38 42 L 62 42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <circle cx="72" cy="42" r="3" fill="#3EA6FF" />
  <!-- Lower track: accent-initiated bottom subtitle bar looping back -->
  <path d="M 70 42 A 12 12 0 0 1 70 66 L 46 66" fill="none" stroke="#3EA6FF" stroke-width="6" stroke-linecap="round" />
  <circle cx="36" cy="66" r="3" fill="#FFFFFF" />
</svg>
</div><p>1. Dual Subtitle Stadium Loop</p></div>
<div><div style="width:260px;height:260px;border-radius:56px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="260" height="260">
  <rect width="260" height="260" fill="#000000" />
  <!-- Broken loop ring around the centre -->
  <path d="M 32 46 A 23.4 23.4 0 0 1 76 46" fill="none" stroke="#444444" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 76 62 A 23.4 23.4 0 0 1 32 62" fill="none" stroke="#444444" stroke-width="4.5" stroke-linecap="round" />
  <!-- Primary active subtitle line -->
  <rect x="33" y="45" width="32" height="7" rx="3.5" fill="#FFFFFF" />
  <circle cx="71.5" cy="48.5" r="3.5" fill="#3EA6FF" />
  <!-- Secondary alternate subtitle line (shifted / toggled) -->
  <circle cx="36.5" cy="59.5" r="3.5" fill="#FFFFFF" />
  <rect x="43" y="56" width="32" height="7" rx="3.5" fill="#3EA6FF" />
</svg>
</div><p>2. Orbital Toggle Bars</p></div>
<div><div style="width:260px;height:260px;border-radius:56px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="260" height="260">
  <rect width="260" height="260" fill="#000000" />
  <!-- Left loop ring -->
  <circle cx="44" cy="54" r="15" fill="none" stroke="#FFFFFF" stroke-width="5.5" />
  <!-- Right loop ring (recessed) -->
  <circle cx="64" cy="54" r="15" fill="none" stroke="#444444" stroke-width="5.5" />
  <!-- Central woven switch segment & dual language bars -->
  <path d="M 55.2 44 A 15 15 0 0 1 55.2 64" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
  <rect x="47" y="48.5" width="14" height="4.5" rx="2.25" fill="#3EA6FF" />
  <rect x="47" y="55" width="14" height="4.5" rx="2.25" fill="#FFFFFF" />
</svg>
</div><p>3. Interlocking Twin Rings</p></div>
<div><div style="width:260px;height:260px;border-radius:56px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="260" height="260">
  <rect width="260" height="260" fill="#000000" />
  <!-- Top half-loop with horizontal extension -->
  <path d="M 33 50 A 21 21 0 0 1 75 50 L 47 50" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom half-loop mirrored with horizontal extension -->
  <path d="M 75 58 A 21 21 0 0 1 33 58 L 61 58" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Active switch node on the lower track -->
  <rect x="49" y="55" width="15" height="6" rx="3" fill="#3EA6FF" />
</svg>
</div><p>4. Split Cycle Switch</p></div>
<div><div style="width:260px;height:260px;border-radius:56px;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="260" height="260">
  <rect width="260" height="260" fill="#000000" />
  <!-- Left turnaround arc connecting the two language planes -->
  <path d="M 46 37 A 17 17 0 0 0 46 71" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <!-- Right turnaround arc completing the cycle -->
  <path d="M 62 37 A 17 17 0 0 1 62 71" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round" />
  <!-- Dual central subtitle bars inside the loop -->
  <rect x="42" y="46.5" width="24" height="6" rx="3" fill="#FFFFFF" />
  <rect x="42" y="55.5" width="15" height="6" rx="3" fill="#3EA6FF" />
  <circle cx="63" cy="58.5" r="3" fill="#FFFFFF" />
</svg>
</div><p>5. Parallel Cadence Loop</p></div>
</body></html>
