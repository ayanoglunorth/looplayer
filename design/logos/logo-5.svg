<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#000000" />
  <!-- Left turnaround arc connecting the two language planes -->
  <path d="M 46 37 A 17 17 0 0 0 46 71" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <!-- Right turnaround arc completing the cycle -->
  <path d="M 62 37 A 17 17 0 0 1 62 71" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round" />
  <!-- Dual central subtitle bars inside the loop -->
  <rect x="42" y="46.5" width="24" height="6" rx="3" fill="#FFFFFF" />
  <rect x="42" y="55.5" width="15" height="6" rx="3" fill="#3EA6FF" />
  <circle cx="63" cy="58.5" r="3" fill="#FFFFFF" />
</svg>
